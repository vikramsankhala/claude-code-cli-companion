name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env: { KB_EMBEDDER: hash }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
