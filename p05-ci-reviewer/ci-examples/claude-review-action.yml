# Alternative using the official action: Claude posts its review as a PR comment.
# Copy to .github/workflows/ in your repository. Use the CLI workflow above when you need a pass/fail gate.
name: Claude PR review (action)
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for bugs, security problems and missing tests.
            Start with a risk rating (low, medium or high), then list findings with file, line, issue and fix.
            Post the review as a single PR comment.
          claude_args: "--max-turns 8"
