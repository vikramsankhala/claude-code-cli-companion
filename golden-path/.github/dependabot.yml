# Use this instead of renovate.json if you prefer GitHub's built-in updater. Keep only one of the two.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "08:31", timezone: Asia/Kolkata }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "08:31", timezone: Asia/Kolkata }
