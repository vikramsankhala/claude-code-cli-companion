name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.project }} · Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
        project: [p07-mini-coder, p08-kb-rag, p09-dms, p10-knowledge-platform, ch26-detagent, part11-sutra-erp]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      KB_EMBEDDER: hash
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run tests
        shell: bash
        run: |
          if [ "${{ matrix.project }}" = "p07-mini-coder" ]; then
            python test_agent.py && python test_agent_extended.py
          else
            python -m pytest -q
          fi
      - name: System eval gates
        if: matrix.project == 'part11-sutra-erp'
        run: python -m sutra.evals

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
