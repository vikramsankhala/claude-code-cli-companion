# Golden path applied to this repository: pre-commit (ruff, gitleaks, file hygiene) and Semgrep on every push.
name: Lint
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks          # the Tests workflow runs gitleaks over the full history already
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Project rules (blocking)
        run: semgrep scan --config golden-path/semgrep/rules.yml --error --metrics=off
      - name: Registry rules for Python (report only; teaching code runs shells and servers on purpose)
        run: semgrep scan --config p/python --metrics=off || true
