# Sutra extras against real services: TimescaleDB + pgvector and Mosquitto from part11-sutra-erp/docker-compose.yml.
# Runs when Sutra changes, and on demand from the Actions tab (Run workflow).
name: Sutra services
on:
  push:
    branches: [main]
    paths: ["part11-sutra-erp/**", ".github/workflows/sutra-services.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  services:
    name: Database and MQTT integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: part11-sutra-erp
    env:
      SUTRA_PG_DSN: postgresql://sutra:sutra@localhost:5432/sutra
      SUTRA_PG_FULL: "1"
      SUTRA_MQTT_HOST: localhost
      KB_EMBEDDER: hash
    steps:
      - uses: actions/checkout@v4
      - name: Start TimescaleDB and Mosquitto
        run: docker compose up -d --wait --wait-timeout 300
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: part11-sutra-erp/requirements*.txt
      - run: python -m pip install -r requirements-extras.txt
      - name: Schema loaded on first start
        run: python schema/apply.py --check
      - name: Integration tests (QAOA, MQTT round trip, schema)
        run: python -m pytest -q tests/test_extras.py -rs
      - name: Edge demo over the real broker
        run: |
          timeout 20 python -u -m sutra.mqtt_edge gateway --host localhost > gateway.log 2>&1 &
          sleep 3
          python -m sutra.mqtt_edge sensors --host localhost --hours 96
          sleep 3
          cat gateway.log
          grep -q "predictive/warning" gateway.log
      - name: Service logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
