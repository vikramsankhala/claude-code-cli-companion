# Golden path applied to this repository (Chapter 24; templates in golden-path/).
# Install once per clone:  pip install pre-commit && pre-commit install
# Run on everything:       pre-commit run --all-files
# This repository lints but does not reformat: the code matches the book's printed listings.
# golden-path/.pre-commit-config.yaml adds ruff-format for new projects.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=800"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
