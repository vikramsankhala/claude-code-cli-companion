# .github/workflows/codex-review.yml: Codex reviews every pull request (Chapters 16 and 18)
name: Codex review
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: "Review the pull request diff. List real bugs, security risks and missing tests, each with file, line and a fix."
